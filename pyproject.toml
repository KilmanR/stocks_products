[tool.ruff]
# Целевая версия Python (укажи свою, например, "py310", "py312" или "py314")
target-version = "py314"

# Длина строки (стандарт Black)
line-length = 88

# Папки и файлы, которые Ruff должен игнорировать
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "migrations",        # Миграции Django генерируются автоматически, их не линтуют
    ".git",
    "manage.py",         # Часто игнорируют, так как это стандартный файл Django
]

[tool.ruff.lint]
# Наборы правил, которые мы включаем:
# E, W - pycodestyle (стиль кода, замена flake8)
# F    - pyflakes (логические ошибки, замена flake8)
# I    - isort (автоматическая сортировка импортов)
# B    - flake8-bugbear (поиск частых ошибок и плохих практик)
# UP   - pyupgrade (подсказки по использованию современного синтаксиса Python)
# DJ   - flake8-django (специфичные правила именно для Django!)
# SIM  - flake8-simplify (подсказки, как упростить и укоротить код)
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]

# Правила, которые мы намеренно игнорируем
ignore = [
    "E501", # Игнорируем "line too long", так как за длиной строки следит `ruff format`
]

[tool.ruff.lint.isort]
# Укажи здесь имена своих django-приложений, чтобы Ruff правильно группировал импорты
known-first-party = ["smart_home", "measurement"]